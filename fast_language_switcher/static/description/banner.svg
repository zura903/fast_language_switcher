<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Blue glow for accent blob -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Systray card shadow -->
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Overlay card shadow -->
    <filter id="overlay-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <!-- Clip for main card -->
    <clipPath id="card-clip">
      <rect x="88" y="80" width="640" height="470" rx="20"/>
    </clipPath>
  </defs>

  <!-- ── BG ────────────────────────────────────────── -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="220" cy="340" rx="380" ry="300" fill="url(#blob1)"/>
  <ellipse cx="960" cy="200" rx="320" ry="280" fill="url(#blob2)"/>
  <ellipse cx="900" cy="520" rx="260" ry="200" fill="url(#blob3)"/>

  <!-- ── MOCK ODOO TOPBAR ──────────────────────────── -->
  <g filter="url(#shadow)">
    <!-- Main browser-window card -->
    <rect x="88" y="80" width="640" height="470" rx="20" fill="#161B27" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Window chrome / titlebar -->
    <rect x="88" y="80" width="640" height="40" rx="20" fill="#1E2535"/>
    <rect x="88" y="100" width="640" height="20" fill="#1E2535"/>

    <!-- Traffic lights -->
    <circle cx="118" cy="100" r="6" fill="#FF5F57"/>
    <circle cx="138" cy="100" r="6" fill="#FEBC2E"/>
    <circle cx="158" cy="100" r="6" fill="#28C840"/>

    <!-- URL bar -->
    <rect x="200" y="88" width="340" height="24" rx="6" fill="#0D1117" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <text x="370" y="104" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#6B7A96">mycompany.odoo.com</text>

    <!-- Odoo topbar -->
    <rect x="88" y="120" width="640" height="52" fill="#1B2032" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- Odoo logo area -->
    <rect x="104" y="132" width="28" height="28" rx="6" fill="#875A7B"/>
    <text x="118" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">O</text>

    <!-- Nav items -->
    <text x="152" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">Sales</text>
    <text x="204" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">CRM</text>
    <text x="247" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">Invoicing</text>
    <text x="320" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">HR</text>

    <!-- Search bar -->
    <rect x="370" y="133" width="180" height="26" rx="5" fill="#0D1117" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <text x="383" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4B5563">Search…</text>

    <!-- Systray right side: debug, discuss, flag button -->
    <circle cx="590" cy="146" r="12" fill="#1E2B40"/>
    <text x="590" y="150.5" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7A96">✉</text>

    <circle cx="618" cy="146" r="12" fill="#1E2B40"/>
    <text x="618" y="151" text-anchor="middle" font-family="Arial" font-size="12" fill="#6B7A96">⚙</text>

    <!-- ★ The Flag Systray button (highlighted) -->
    <rect x="638" y="130" width="54" height="32" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- Glow ring -->
    <rect x="635" y="127" width="60" height="38" rx="10" fill="none" stroke="#3B82F6" stroke-opacity="0.25" stroke-width="3"/>
    <text x="650" y="151" font-family="Arial" font-size="16" fill="#ffffff">🇬🇧</text>
    <text x="668" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="bold" fill="#93BBFF">EN</text>

    <!-- User avatar -->
    <circle cx="708" cy="146" r="14" fill="#7C3AED"/>
    <text x="708" y="150.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">JD</text>

    <!-- Page content area (fake Odoo list) -->
    <rect x="88" y="172" width="640" height="378" fill="#0F1420"/>

    <!-- Sidebar -->
    <rect x="88" y="172" width="160" height="378" fill="#131929"/>

    <text x="108" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" letter-spacing="0.08em">NAVIGATION</text>
    <rect x="104" y="214" width="128" height="28" rx="6" fill="#1E3A5F"/>
    <text x="168" y="232" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#93BBFF">Dashboard</text>
    <text x="168" y="262" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">Contacts</text>
    <text x="168" y="286" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">Reports</text>
    <text x="168" y="310" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4B5563">Settings</text>

    <!-- Main content area rows -->
    <rect x="262" y="188" width="440" height="30" rx="6" fill="#1A2235"/>
    <text x="282" y="207" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#9CA3AF">COMPANY OVERVIEW</text>

    <rect x="262" y="228" width="200" height="48" rx="8" fill="#1E2B40" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <text x="282" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">Revenue (MTD)</text>
    <text x="282" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8EDF5">€24,880</text>

    <rect x="472" y="228" width="200" height="48" rx="8" fill="#1E2B40" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <text x="492" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">Open Orders</text>
    <text x="492" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8EDF5">137</text>

    <!-- Table header -->
    <rect x="262" y="292" width="440" height="24" rx="4" fill="#1A2235"/>
    <text x="278" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">NAME</text>
    <text x="440" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">STATUS</text>
    <text x="580" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">DATE</text>

    <!-- Table rows -->
    <line x1="262" y1="316" x2="702" y2="316" stroke="#ffffff" stroke-opacity="0.04"/>
    <text x="278" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">Acme Corp</text>
    <rect x="430" y="322" width="52" height="16" rx="4" fill="#064E3B"/>
    <text x="456" y="334" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#34D399">Done</text>
    <text x="580" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">12 Mar</text>

    <line x1="262" y1="342" x2="702" y2="342" stroke="#ffffff" stroke-opacity="0.04"/>
    <text x="278" y="358" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">TechFlow Ltd</text>
    <rect x="430" y="348" width="60" height="16" rx="4" fill="#1E3A5F"/>
    <text x="460" y="360" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#60A5FA">In Progress</text>
    <text x="580" y="358" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">10 Mar</text>

    <line x1="262" y1="368" x2="702" y2="368" stroke="#ffffff" stroke-opacity="0.04"/>
    <text x="278" y="384" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">Nova Partners</text>
    <rect x="430" y="374" width="52" height="16" rx="4" fill="#064E3B"/>
    <text x="456" y="386" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#34D399">Done</text>
    <text x="580" y="384" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6B7A96">8 Mar</text>

    <!-- Blur overlay on lower portion -->
    <rect x="88" y="400" width="640" height="148" fill="url(#bg)" fill-opacity="0.5" rx="0"/>
    <rect x="88" y="520" width="640" height="30" rx="0" fill="#0D1117" fill-opacity="0.8"/>
    <rect x="88" y="520" width="640" height="28" rx="0" fill="url(#bg)"/>
    <rect x="88" y="530" width="640" height="20" rx="0" fill="#0D1117" fill-opacity="0.9"/>

    <!-- ── KEYBOARD OVERLAY (floating card) ──────── -->
    <g filter="url(#overlay-shadow)">
      <rect x="240" y="230" width="340" height="320" rx="16" fill="#1A2235" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
      <!-- Frosted tint -->
      <rect x="240" y="230" width="340" height="320" rx="16" fill="#3B82F6" fill-opacity="0.04"/>

      <!-- Header -->
      <rect x="240" y="230" width="340" height="44" rx="16" fill="#1E2B40"/>
      <rect x="240" y="250" width="340" height="24" fill="#1E2B40"/>
      <text x="410" y="257" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#9CA3AF" letter-spacing="0.1em">SWITCH LANGUAGE</text>

      <!-- Language rows -->
      <!-- Active / highlighted row -->
      <rect x="252" y="284" width="316" height="46" rx="10" fill="#1E3A5F" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="290" y="313" font-family="Arial" font-size="22" fill="#ffffff">🇬🇧</text>
      <text x="326" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#E8EDF5">English</text>
      <text x="326" y="323" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B80C0">en_US · Active</text>
      <!-- Check mark -->
      <circle cx="540" cy="307" r="10" fill="#3B82F6"/>
      <text x="540" y="312" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">✓</text>

      <!-- Row 2 -->
      <rect x="252" y="340" width="316" height="46" rx="10" fill="#131929" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <text x="290" y="369" font-family="Arial" font-size="22" fill="#ffffff">🇫🇷</text>
      <text x="326" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9CA3AF">Français</text>
      <text x="326" y="379" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#374151">fr_FR</text>

      <!-- Row 3 -->
      <rect x="252" y="396" width="316" height="46" rx="10" fill="#131929" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <text x="290" y="425" font-family="Arial" font-size="22" fill="#ffffff">🇩🇪</text>
      <text x="326" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9CA3AF">Deutsch</text>
      <text x="326" y="435" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#374151">de_DE</text>

      <!-- Row 4 -->
      <rect x="252" y="452" width="316" height="46" rx="10" fill="#131929" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <text x="290" y="481" font-family="Arial" font-size="22" fill="#ffffff">🇯🇵</text>
      <text x="326" y="476" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9CA3AF">日本語</text>
      <text x="326" y="491" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#374151">ja_JP</text>

      <!-- Footer hint bar -->
      <rect x="240" y="514" width="340" height="36" rx="16" fill="#131929"/>
      <rect x="240" y="514" width="340" height="20" fill="#131929"/>

      <!-- Keyboard hints -->
      <rect x="262" y="521" width="44" height="22" rx="5" fill="#1E2B40" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="284" y="536" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#9CA3AF">Ctrl</text>
      <text x="316" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4B5563">+</text>
      <rect x="324" y="521" width="24" height="22" rx="5" fill="#1E2B40" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
      <text x="336" y="536" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#9CA3AF">L</text>
      <text x="362" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#374151">cycle · release to apply · Esc to cancel</text>
    </g>
  </g>

  <!-- ── RIGHT PANEL: TEXT ────────────────────────── -->
  <!-- Module badge -->
  <rect x="800" y="96" width="120" height="24" rx="6" fill="#064E3B" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>
  <text x="860" y="112" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#34D399" letter-spacing="0.08em">v 1.1.0  ·  LGPL-3</text>

  <!-- Headline -->
  <text x="800" y="170" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#E8EDF5" letter-spacing="-0.02em">Fast</text>
  <text x="800" y="232" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#E8EDF5" letter-spacing="-0.02em">Language</text>
  <!-- Accent word -->
  <text x="800" y="294" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" fill="#3B82F6" letter-spacing="-0.02em">Switcher</text>

  <!-- Sub-description -->
  <text x="800" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B7A96" letter-spacing="0.005em">Flag-based language picker</text>
  <text x="800" y="358" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B7A96">for the Odoo systray.</text>

  <!-- Divider -->
  <line x1="800" y1="384" x2="1110" y2="384" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Feature list -->
  <!-- Feature 1 -->
  <rect x="800" y="398" width="24" height="24" rx="6" fill="#1E3A5F"/>
  <text x="812" y="414" text-anchor="middle" font-family="Arial" font-size="13" fill="#60A5FA">⌨</text>
  <text x="834" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">Configurable keyboard shortcut</text>

  <!-- Feature 2 -->
  <rect x="800" y="432" width="24" height="24" rx="6" fill="#1E3A5F"/>
  <text x="812" y="448" text-anchor="middle" font-family="Arial" font-size="14" fill="#60A5FA">🏳</text>
  <text x="834" y="449" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">Auto-derived country flags</text>

  <!-- Feature 3 -->
  <rect x="800" y="466" width="24" height="24" rx="6" fill="#1E3A5F"/>
  <text x="812" y="482" text-anchor="middle" font-family="Arial" font-size="12" fill="#60A5FA">🔄</text>
  <text x="834" y="483" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9CA3AF">Cycle + click — one action to switch</text>

  <!-- Compat pills row -->
  <rect x="800" y="516" width="72" height="26" rx="7" fill="#1E2535" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="836" y="533" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#9CA3AF">Odoo 17</text>

  <rect x="880" y="516" width="72" height="26" rx="7" fill="#1E2535" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="916" y="533" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#9CA3AF">Odoo 18</text>

  <rect x="960" y="516" width="72" height="26" rx="7" fill="#1E2535" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="996" y="533" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#9CA3AF">Odoo 19</text>

  <!-- Bottom attribution line -->
  <text x="800" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#374151">Odoo Module · Tools Category</text>
</svg>
